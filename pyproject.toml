[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudorange-spp"
version = "2.1.0"
description = "伪距单点定位（SPP）教学与实验工具：RINEX/SP3/CLK 解析、抗差最小二乘解算与可视化"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "zbf1154-ctrl" }]
keywords = ["GNSS", "GPS", "SPP", "RINEX", "SP3", "pseudorange"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.23",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
spp = "spp.cli:main"

[tool.setuptools]
packages = ["spp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"
